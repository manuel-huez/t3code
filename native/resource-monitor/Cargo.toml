[package]
name = "t3-resource-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.3"
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
